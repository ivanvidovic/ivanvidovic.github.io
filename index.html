<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Keychain AR</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      :root {
        --bg: rgba(0, 0, 0, 0.35);
        --panel: rgba(20, 20, 22, 0.55);
        --panel2: rgba(255, 255, 255, 0.10);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --stroke: rgba(255, 255, 255, 0.18);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        --radius: 18px;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }

      /* Ensure camera video sits behind the WebGL canvas */
      video {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 0 !important;
      }

      canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
        z-index: 1 !important;
        display: block !important;
      }

      /* Fullscreen UI overlay */
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      /* Status pill */
      #statusPill {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 14px);
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--stroke);
        color: var(--text);
        font-size: 13px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        pointer-events: none;
        opacity: 0;
        transition: opacity 220ms ease;
        max-width: min(92vw, 520px);
        text-align: center;
      }

      #statusPill.show {
        opacity: 1;
      }

      /* Start card */
      #gate {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        padding: 18px;
      }

      #card {
        width: min(440px, 92vw);
        border-radius: var(--radius);
        background: linear-gradient(180deg, var(--panel), rgba(20, 20, 22, 0.35));
        border: 1px solid var(--stroke);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        pointer-events: auto;
        overflow: hidden;
      }

      #cardInner {
        padding: 18px 18px 16px 18px;
      }

      #title {
        font-size: 18px;
        letter-spacing: 0.2px;
        color: var(--text);
        margin: 0;
      }

      #sub {
        margin: 8px 0 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.35;
      }

      #btnRow {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 14px;
        padding: 12px 14px;
        font-weight: 650;
        font-size: 14px;
        cursor: pointer;
      }

      #startBtn {
        background: rgba(255, 255, 255, 0.92);
        color: #0b0b0c;
      }

      #startBtn:active {
        transform: translateY(1px);
      }

      #secondaryBtn {
        background: rgba(255, 255, 255, 0.10);
        color: var(--text);
        border: 1px solid var(--stroke);
      }

      #fine {
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.62);
        font-size: 12px;
        line-height: 1.35;
      }

      /* Bottom hint */
      #hint {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom) + 14px);
        width: min(680px, 92vw);
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid var(--stroke);
        color: rgba(255, 255, 255, 0.88);
        font-size: 13px;
        line-height: 1.25;
        text-align: center;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: none;
        opacity: 0;
        transition: opacity 220ms ease;
      }

      #hint.show {
        opacity: 1;
      }

      /* Optional subtle vignette to make UI readable */
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0) 55%,
          rgba(0, 0, 0, 0.28) 100%
        );
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="overlay" aria-hidden="true">
      <div id="vignette"></div>

      <div id="statusPill">Initializing…</div>

      <div id="gate">
        <div id="card">
          <div id="cardInner">
            <h1 id="title">Keychain AR</h1>
            <p id="sub">
              Tap Start, allow camera access, then point at the symbol to place the 3D model.
            </p>

            <div id="btnRow">
              <button id="startBtn" type="button">Start</button>
              <button id="secondaryBtn" type="button">Reload</button>
            </div>

            <div id="fine">
              Tip: Bright, diffuse light helps. Glossy surfaces can cause tracking jitter.
            </div>
          </div>
        </div>
      </div>

      <div id="hint">Move closer and keep the symbol in frame.</div>
    </div>

    <a-scene
      id="scene"
      embedded
      renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      mindar-image="
        imageTargetSrc: ./targets/targets.mind;
        autoStart: false;
        uiScanning: true;
        uiLoading: true;

        filterMinCF: 0.001;
        filterBeta: 25;

        warmupTolerance: 10;
        missTolerance: 10;
      "
    >
      <a-assets>
        <a-asset-item id="model" src="./models/model.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; intensity: 0.9"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="0 2 1"></a-entity>

      <a-entity id="anchor" mindar-image-target="targetIndex: 0">
        <a-entity
          id="smooth"
          pose-stabilizer="posLerp: 0.14; rotLerp: 0.12; scaleLerp: 0.10; maxScaleStep: 0.015; holdMs: 250;"
        >
          <a-gltf-model
            src="#model"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.35 0.35 0.35"
          ></a-gltf-model>
        </a-entity>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const overlay = document.getElementById("overlay");
      const gate = document.getElementById("gate");
      const startBtn = document.getElementById("startBtn");
      const secondaryBtn = document.getElementById("secondaryBtn");
      const statusPill = document.getElementById("statusPill");
      const hint = document.getElementById("hint");

      const sceneEl = document.getElementById("scene");
      const anchorEl = document.getElementById("anchor");

      function showStatus(msg) {
        statusPill.textContent = msg;
        statusPill.classList.add("show");
      }

      function hideStatus() {
        statusPill.classList.remove("show");
      }

      function showHint(msg) {
        if (msg) hint.textContent = msg;
        hint.classList.add("show");
      }

      function hideHint() {
        hint.classList.remove("show");
      }

      AFRAME.registerComponent("pose-stabilizer", {
        schema: {
          posLerp: { type: "number", default: 0.14 },
          rotLerp: { type: "number", default: 0.12 },
          scaleLerp: { type: "number", default: 0.10 },
          maxScaleStep: { type: "number", default: 0.015 },
          holdMs: { type: "number", default: 250 }
        },

        init: function () {
          this._smPos = new THREE.Vector3();
          this._smQuat = new THREE.Quaternion();
          this._smScale = new THREE.Vector3(1, 1, 1);
          this._tmpScale = new THREE.Vector3();

          this._hasInit = false;
          this._lastSeen = performance.now();
          this._visible = false;
        },

        tick: function () {
          const now = performance.now();
          const parent = this.el.parentEl && this.el.parentEl.object3D;
          if (!parent) return;

          const tracked = parent.visible === true;

          if (tracked) {
            this._lastSeen = now;

            const pos = parent.position;
            const quat = parent.quaternion;
            const scale = parent.scale;

            if (!this._hasInit) {
              this._smPos.copy(pos);
              this._smQuat.copy(quat);
              this._smScale.copy(scale);
              this._hasInit = true;
            } else {
              this._smPos.lerp(pos, this.data.posLerp);
              this._smQuat.slerp(quat, this.data.rotLerp);

              const dx = scale.x - this._smScale.x;
              const dy = scale.y - this._smScale.y;
              const dz = scale.z - this._smScale.z;

              const maxStep = this.data.maxScaleStep;
              this._tmpScale.set(
                this._smScale.x + Math.max(-maxStep, Math.min(maxStep, dx)),
                this._smScale.y + Math.max(-maxStep, Math.min(maxStep, dy)),
                this._smScale.z + Math.max(-maxStep, Math.min(maxStep, dz))
              );

              this._smScale.lerp(this._tmpScale, this.data.scaleLerp);
            }

            this.el.object3D.position.copy(this._smPos);
            this.el.object3D.quaternion.copy(this._smQuat);
            this.el.object3D.scale.copy(this._smScale);

            this._visible = true;
            this.el.object3D.visible = true;
          } else {
            if (this._visible && (now - this._lastSeen) < this.data.holdMs) {
              this.el.object3D.visible = true;
            } else {
              this.el.object3D.visible = false;
              this._visible = false;
            }
          }
        }
      });

      async function startAR() {
        try {
          showStatus("Starting camera…");

          if (!sceneEl.hasLoaded) {
            await new Promise((resolve) =>
              sceneEl.addEventListener("loaded", resolve, { once: true })
            );
          }

          const mindarSystem = sceneEl.systems["mindar-image-system"];
          await mindarSystem.start();

          gate.style.display = "none";
          hideStatus();
          showHint("Keep the symbol in frame.");

          setTimeout(() => hideHint(), 1800);
        } catch (e) {
          console.error(e);
          showStatus("Camera start failed. Tap Reload.");
        }
      }

      startBtn.addEventListener("click", startAR);
      secondaryBtn.addEventListener("click", () => location.reload());

      anchorEl.addEventListener("targetFound", () => {
        showStatus("Locked on");
        setTimeout(() => hideStatus(), 650);
      });

      anchorEl.addEventListener("targetLost", () => {
        showHint("Target lost. Move closer and reduce glare.");
      });

      showStatus("Ready");
    </script>
  </body>
</html>
