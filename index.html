<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Keychain AR</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }
      video {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 0 !important;
      }
      canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
        z-index: 1 !important;
        display: block !important;
      }
      #hint {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(env(safe-area-inset-bottom) + 12px);
        text-align: center;
        font-size: 13px;
        line-height: 1.25;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transition: opacity 160ms ease;
        z-index: 5;
        pointer-events: none;
      }
      #hint.show { opacity: 1; }
    </style>

    <script>
      // Global tracked flag (reliable for auto-rotate)
      window.__AR_TRACKED__ = false;

      // -------- components (registered before <a-scene>) --------

      AFRAME.registerComponent("pose-stabilizer", {
        schema: {
          posLerp: { type: "number", default: 0.14 },
          rotLerp: { type: "number", default: 0.12 },
          scaleLerp: { type: "number", default: 0.10 },
          maxScaleStep: { type: "number", default: 0.015 },
          holdMs: { type: "number", default: 250 }
        },
        init: function () {
          this._smPos = new THREE.Vector3();
          this._smQuat = new THREE.Quaternion();
          this._smScale = new THREE.Vector3(1, 1, 1);
          this._tmpScale = new THREE.Vector3();
          this._hasInit = false;
          this._lastSeen = performance.now();
          this._visible = false;
        },
        tick: function () {
          const now = performance.now();
          const parent = this.el.parentEl && this.el.parentEl.object3D;
          if (!parent) return;

          const tracked = parent.visible === true;

          if (tracked) {
            this._lastSeen = now;

            const pos = parent.position;
            const quat = parent.quaternion;
            const scale = parent.scale;

            if (!this._hasInit) {
              this._smPos.copy(pos);
              this._smQuat.copy(quat);
              this._smScale.copy(scale);
              this._hasInit = true;
            } else {
              this._smPos.lerp(pos, this.data.posLerp);
              this._smQuat.slerp(quat, this.data.rotLerp);

              const dx = scale.x - this._smScale.x;
              const dy = scale.y - this._smScale.y;
              const dz = scale.z - this._smScale.z;

              const maxStep = this.data.maxScaleStep;
              this._tmpScale.set(
                this._smScale.x + Math.max(-maxStep, Math.min(maxStep, dx)),
                this._smScale.y + Math.max(-maxStep, Math.min(maxStep, dy)),
                this._smScale.z + Math.max(-maxStep, Math.min(maxStep, dz))
              );

              this._smScale.lerp(this._tmpScale, this.data.scaleLerp);
            }

            this.el.object3D.position.copy(this._smPos);
            this.el.object3D.quaternion.copy(this._smQuat);
            this.el.object3D.scale.copy(this._smScale);

            this._visible = true;
            this.el.object3D.visible = true;
          } else {
            if (this._visible && (now - this._lastSeen) < this.data.holdMs) {
              this.el.object3D.visible = true;
            } else {
              this.el.object3D.visible = false;
              this._visible = false;
            }
          }
        }
      });

      AFRAME.registerComponent("touch-manipulator", {
        schema: {
          spinAxis: { type: "string", default: "z" },
          rotateSpeed: { type: "number", default: 0.22 },
          inertia: { type: "number", default: 0.988 },
          inertiaBoost: { type: "number", default: 1.8 },
          autoRotateSpeed: { type: "number", default: 0.35 }, // deg/sec base spin
          minScale: { type: "number", default: 0.05 },
          maxScale: { type: "number", default: 14.0 }
        },
        init: function () {
          this._active = false;
          this._mode = "none";
          this._lastX = 0;

          this._startDist = 0;
          this._startScale = new THREE.Vector3();

          this._velSpin = 0;
          this._lastTick = performance.now();

          this._onTouchStart = this._onTouchStart.bind(this);
          this._onTouchMove = this._onTouchMove.bind(this);
          this._onTouchEnd = this._onTouchEnd.bind(this);

          document.addEventListener("touchstart", this._onTouchStart, { passive: false });
          document.addEventListener("touchmove", this._onTouchMove, { passive: false });
          document.addEventListener("touchend", this._onTouchEnd, { passive: false });
          document.addEventListener("touchcancel", this._onTouchEnd, { passive: false });
        },
        remove: function () {
          document.removeEventListener("touchstart", this._onTouchStart);
          document.removeEventListener("touchmove", this._onTouchMove);
          document.removeEventListener("touchend", this._onTouchEnd);
          document.removeEventListener("touchcancel", this._onTouchEnd);
        },

        // This is the key fix: don't depend on anchor.object3D.visible
        _isTracked: function () {
          return window.__AR_TRACKED__ === true;
        },

        _dist: function (t0, t1) {
          const dx = t0.clientX - t1.clientX;
          const dy = t0.clientY - t1.clientY;
          return Math.hypot(dx, dy);
        },
        _applySpinDelta: function (delta) {
          const r = this.el.object3D.rotation;
          const a = this.data.spinAxis;
          if (a === "x") r.x += delta;
          else if (a === "y") r.y += delta;
          else r.z += delta;
        },
        _onTouchStart: function (e) {
          if (!this._isTracked()) return;

          if (e.touches.length === 1) {
            e.preventDefault();
            this._active = true;
            this._mode = "rotate";
            this._lastX = e.touches[0].clientX;
          } else if (e.touches.length === 2) {
            e.preventDefault();
            this._active = true;
            this._mode = "pinch";
            this._startDist = this._dist(e.touches[0], e.touches[1]);
            this._startScale.copy(this.el.object3D.scale);
          }
        },
        _onTouchMove: function (e) {
          if (!this._active) return;
          if (!this._isTracked()) return;

          if (this._mode === "rotate" && e.touches.length === 1) {
            e.preventDefault();
            const x = e.touches[0].clientX;
            const dx = x - this._lastX;
            this._lastX = x;

            const spinDelta = dx * 0.01 * this.data.rotateSpeed;
            this._applySpinDelta(spinDelta);
            this._velSpin = spinDelta * this.data.inertiaBoost;
          }

          if (this._mode === "pinch" && e.touches.length === 2) {
            e.preventDefault();
            const d = this._dist(e.touches[0], e.touches[1]);
            if (this._startDist <= 0) return;

            const ratio = d / this._startDist;
            const s = Math.max(
              this.data.minScale,
              Math.min(this.data.maxScale, this._startScale.x * ratio)
            );
            this.el.object3D.scale.set(s, s, s);
          }
        },
        _onTouchEnd: function (e) {
          if (e.touches.length === 0) {
            this._active = false;
            this._mode = "none";
            this._startDist = 0;
          } else if (e.touches.length === 1) {
            this._mode = "rotate";
            this._lastX = e.touches[0].clientX;
          }
        },
        tick: function () {
          const now = performance.now();
          const dt = Math.min(0.05, (now - this._lastTick) / 1000);
          this._lastTick = now;

          if (!this._isTracked()) return;

          // Base auto spin always while tracked
          const autoRadPerSec = (this.data.autoRotateSpeed * Math.PI) / 180;
          this._applySpinDelta(autoRadPerSec * dt);

          // Inertia when not touching
          if (!this._active && this._velSpin !== 0) {
            this._applySpinDelta(this._velSpin);

            const f = Math.pow(this.data.inertia, 60 * dt);
            this._velSpin *= f;

            if (Math.abs(this._velSpin) < 0.00002) this._velSpin = 0;
          }
        }
      });

      // -------- procedural env: rotate 90° by shifting equirect horizontally --------

      function makeChromeGradientEquirectCanvas(width = 1024, height = 512) {
        const c = document.createElement("canvas");
        c.width = width;
        c.height = height;
        const ctx = c.getContext("2d");

        const g = ctx.createLinearGradient(0, 0, 0, height);
        g.addColorStop(0.00, "#66B7FF"); // sky blue
        g.addColorStop(0.35, "#CFEAFF"); // light sky blue
        g.addColorStop(0.55, "#2D2F35"); // dark gray
        g.addColorStop(0.72, "#2E7D32"); // grass green
        g.addColorStop(1.00, "#8B5A2B"); // desert brown

        ctx.fillStyle = g;
        ctx.fillRect(0, 0, width, height);

        // horizon highlight
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, Math.floor(height * 0.48), width, Math.floor(height * 0.03));
        ctx.globalAlpha = 1.0;

        // vignette
        const vignette = ctx.createRadialGradient(
          width * 0.5, height * 0.5, height * 0.15,
          width * 0.5, height * 0.5, height * 0.75
        );
        vignette.addColorStop(0.0, "rgba(0,0,0,0)");
        vignette.addColorStop(1.0, "rgba(0,0,0,0.22)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);

        return c;
      }

      function rotateEquirectCanvasX(srcCanvas, shiftFraction = 0.25) {
        const w = srcCanvas.width;
        const h = srcCanvas.height;
        const shiftPx = Math.round(w * shiftFraction);

        const out = document.createElement("canvas");
        out.width = w;
        out.height = h;
        const ctx = out.getContext("2d");

        ctx.drawImage(srcCanvas, w - shiftPx, 0, shiftPx, h, 0, 0, shiftPx, h);
        ctx.drawImage(srcCanvas, 0, 0, w - shiftPx, h, shiftPx, 0, w - shiftPx, h);

        return out;
      }

      function applyEnvToModel(modelEl, envMap, opts = {}) {
        const {
          envIntensity = 2.1,
          forceChrome = true,
          minMetalness = 0.95,
          maxRoughness = 0.16
        } = opts;

        const obj = modelEl.getObject3D("mesh");
        if (!obj) return;

        obj.traverse((n) => {
          if (!n.isMesh || !n.material) return;

          const mats = Array.isArray(n.material) ? n.material : [n.material];
          mats.forEach((m) => {
            const isPBR = !!(m && (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial));
            if (!isPBR) return;

            m.envMap = envMap;
            m.envMapIntensity = envIntensity;

            if (forceChrome) {
              if (typeof m.metalness === "number") m.metalness = Math.max(m.metalness, minMetalness);
              if (typeof m.roughness === "number") m.roughness = Math.min(m.roughness, maxRoughness);
            }

            m.needsUpdate = true;
          });
        });
      }

      async function setupProceduralEnv(sceneEl, modelEl) {
        await new Promise((resolve) => sceneEl.addEventListener("loaded", resolve, { once: true }));

        const renderer = sceneEl.renderer;
        if (!renderer) return;

        // Reduce brightness (25% more than before)
        renderer.toneMappingExposure = 0.95;

        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();

        const base = makeChromeGradientEquirectCanvas(1024, 512);
        const rotated = rotateEquirectCanvasX(base, 0.25);

        const eqTex = new THREE.CanvasTexture(rotated);
        eqTex.mapping = THREE.EquirectangularReflectionMapping;
        eqTex.colorSpace = THREE.SRGBColorSpace;

        const envMap = pmrem.fromEquirectangular(eqTex).texture;

        sceneEl.object3D.environment = envMap;

        eqTex.dispose();
        pmrem.dispose();

        const apply = () => applyEnvToModel(modelEl, envMap, { envIntensity: 2.1, forceChrome: true });

        if (modelEl.getObject3D("mesh")) apply();
        else modelEl.addEventListener("model-loaded", apply, { once: true });
      }
    </script>
  </head>

  <body>
    <div id="hint"></div>

    <a-scene
      id="scene"
      embedded
      renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      mindar-image="
        imageTargetSrc: ./targets/targets.mind;
        autoStart: true;
        uiScanning: true;
        uiLoading: true;

        filterMinCF: 0.001;
        filterBeta: 25;

        warmupTolerance: 10;
        missTolerance: 10;
      "
    >
      <a-assets>
        <a-asset-item id="model" src="./models/model.glb"></a-asset-item>
      </a-assets>

      <!-- Lighting down 25% more -->
      <a-entity light="type: ambient; intensity: 0.34"></a-entity>
      <a-entity light="type: directional; intensity: 0.49" position="1.5 2.2 1.2"></a-entity>
      <a-entity light="type: directional; intensity: 0.26" position="-2 1.6 -1.2"></a-entity>

      <a-entity id="anchor" mindar-image-target="targetIndex: 0">
        <a-entity
          id="smooth"
          pose-stabilizer="posLerp: 0.14; rotLerp: 0.12; scaleLerp: 0.10; maxScaleStep: 0.015; holdMs: 250;"
        >
          <a-entity
            id="spinRoot"
            touch-manipulator="
              spinAxis: z;
              rotateSpeed: 0.22;
              inertia: 0.988;
              inertiaBoost: 1.8;
              autoRotateSpeed: 0.35;
              minScale: 0.05;
              maxScale: 14.0;
            "
          >
            <a-entity id="modelOrient" rotation="90 0 0">
              <a-gltf-model id="arModel" src="#model" scale="1.05 1.05 1.05"></a-gltf-model>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const hintEl = document.getElementById("hint");
      const anchorEl = document.getElementById("anchor");
      const sceneEl = document.getElementById("scene");
      const modelEl = document.getElementById("arModel");

      let hintTimer = null;
      function showHint(msg, autoHideMs = 0) {
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = null;

        hintEl.textContent = msg || "";
        hintEl.classList.toggle("show", !!msg);

        if (msg && autoHideMs > 0) {
          hintTimer = setTimeout(() => {
            hintEl.classList.remove("show");
            hintEl.textContent = "";
            hintTimer = null;
          }, autoHideMs);
        }
      }

      showHint("Drag to spin. Pinch to scale.", 900);

      // Reliable tracked flag for auto-rotate
      anchorEl.addEventListener("targetFound", () => {
        window.__AR_TRACKED__ = true;
        showHint("", 0);
      });
      anchorEl.addEventListener("targetLost", () => {
        window.__AR_TRACKED__ = false;
        showHint("Target lost. Move closer and reduce glare.");
      });

      setupProceduralEnv(sceneEl, modelEl);

      // Optional: if you want to *prove* auto-rotate is running, temporarily set:
      // autoRotateSpeed: 1.2;
      // in the touch-manipulator attributes above.
    </script>
  </body>
</html>
