<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Keychain AR</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }

      video {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 0 !important;
      }

      canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
        z-index: 1 !important;
        display: block !important;
      }

      #hint {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(env(safe-area-inset-bottom) + 12px);
        text-align: center;
        font-size: 13px;
        line-height: 1.25;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transition: opacity 160ms ease;
        z-index: 5;
        pointer-events: none;
      }

      #hint.show { opacity: 1; }
    </style>
  </head>

  <body>
    <div id="hint"></div>

    <a-scene
      id="scene"
      embedded
      renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      mindar-image="
        imageTargetSrc: ./targets/targets.mind;
        autoStart: true;
        uiScanning: true;
        uiLoading: true;

        filterMinCF: 0.001;
        filterBeta: 25;

        warmupTolerance: 10;
        missTolerance: 10;
      "
    >
      <a-assets>
        <a-asset-item id="model" src="./models/model.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; intensity: 0.9"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="0 2 1"></a-entity>

      <a-entity id="anchor" mindar-image-target="targetIndex: 0">
        <a-entity
          id="smooth"
          pose-stabilizer="posLerp: 0.14; rotLerp: 0.12; scaleLerp: 0.10; maxScaleStep: 0.015; holdMs: 250;"
        >
          <!-- spinRoot is the only node we rotate and scale -->
          <a-entity
            id="spinRoot"
            touch-manipulator="
              rotateSpeed: 0.20;
              inertia: 0.93;
              autoRotateSpeed: 0.18;
              minScale: 0.06;
              maxScale: 10.0;
              lockPitch: true;
            "
          >
            <!-- modelOrient only fixes the model so it lies flat on the target -->
            <!-- If this ends up flipped the wrong way on your device, change -90 to 90 -->
            <a-entity id="modelOrient" rotation="-90 0 0">
              <a-gltf-model
                id="arModel"
                src="#model"
                scale="1.00 1.00 1.00"
              ></a-gltf-model>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const hintEl = document.getElementById("hint");
      const anchorEl = document.getElementById("anchor");

      let hintTimer = null;
      function showHint(msg, autoHideMs = 0) {
        if (hintTimer) {
          clearTimeout(hintTimer);
          hintTimer = null;
        }
        hintEl.textContent = msg || "";
        if (msg) hintEl.classList.add("show");
        else hintEl.classList.remove("show");

        if (msg && autoHideMs > 0) {
          hintTimer = setTimeout(() => {
            hintEl.classList.remove("show");
            hintEl.textContent = "";
            hintTimer = null;
          }, autoHideMs);
        }
      }

      AFRAME.registerComponent("pose-stabilizer", {
        schema: {
          posLerp: { type: "number", default: 0.14 },
          rotLerp: { type: "number", default: 0.12 },
          scaleLerp: { type: "number", default: 0.10 },
          maxScaleStep: { type: "number", default: 0.015 },
          holdMs: { type: "number", default: 250 }
        },

        init: function () {
          this._smPos = new THREE.Vector3();
          this._smQuat = new THREE.Quaternion();
          this._smScale = new THREE.Vector3(1, 1, 1);
          this._tmpScale = new THREE.Vector3();
          this._hasInit = false;
          this._lastSeen = performance.now();
          this._visible = false;
        },

        tick: function () {
          const now = performance.now();
          const parent = this.el.parentEl && this.el.parentEl.object3D;
          if (!parent) return;

          const tracked = parent.visible === true;

          if (tracked) {
            this._lastSeen = now;

            const pos = parent.position;
            const quat = parent.quaternion;
            const scale = parent.scale;

            if (!this._hasInit) {
              this._smPos.copy(pos);
              this._smQuat.copy(quat);
              this._smScale.copy(scale);
              this._hasInit = true;
            } else {
              this._smPos.lerp(pos, this.data.posLerp);
              this._smQuat.slerp(quat, this.data.rotLerp);

              const dx = scale.x - this._smScale.x;
              const dy = scale.y - this._smScale.y;
              const dz = scale.z - this._smScale.z;

              const maxStep = this.data.maxScaleStep;
              this._tmpScale.set(
                this._smScale.x + Math.max(-maxStep, Math.min(maxStep, dx)),
                this._smScale.y + Math.max(-maxStep, Math.min(maxStep, dy)),
                this._smScale.z + Math.max(-maxStep, Math.min(maxStep, dz))
              );

              this._smScale.lerp(this._tmpScale, this.data.scaleLerp);
            }

            this.el.object3D.position.copy(this._smPos);
            this.el.object3D.quaternion.copy(this._smQuat);
            this.el.object3D.scale.copy(this._smScale);

            this._visible = true;
            this.el.object3D.visible = true;
          } else {
            if (this._visible && (now - this._lastSeen) < this.data.holdMs) {
              this.el.object3D.visible = true;
            } else {
              this.el.object3D.visible = false;
              this._visible = false;
            }
          }
        }
      });

      AFRAME.registerComponent("touch-manipulator", {
        schema: {
          rotateSpeed: { type: "number", default: 0.20 },
          inertia: { type: "number", default: 0.93 },
          autoRotateSpeed: { type: "number", default: 0.18 }, // degrees per second
          minScale: { type: "number", default: 0.06 },
          maxScale: { type: "number", default: 10.0 },
          lockPitch: { type: "boolean", default: true }
        },

        init: function () {
          this._active = false;
          this._mode = "none";
          this._lastX = 0;
          this._lastY = 0;

          this._startDist = 0;
          this._startScale = new THREE.Vector3();

          this._velYaw = 0;
          this._velPitch = 0;

          this._onTouchStart = this._onTouchStart.bind(this);
          this._onTouchMove = this._onTouchMove.bind(this);
          this._onTouchEnd = this._onTouchEnd.bind(this);

          document.addEventListener("touchstart", this._onTouchStart, { passive: false });
          document.addEventListener("touchmove", this._onTouchMove, { passive: false });
          document.addEventListener("touchend", this._onTouchEnd, { passive: false });
          document.addEventListener("touchcancel", this._onTouchEnd, { passive: false });

          this._lastTick = performance.now();
        },

        remove: function () {
          document.removeEventListener("touchstart", this._onTouchStart);
          document.removeEventListener("touchmove", this._onTouchMove);
          document.removeEventListener("touchend", this._onTouchEnd);
          document.removeEventListener("touchcancel", this._onTouchEnd);
        },

        _isModelVisible: function () {
          const anchor = document.getElementById("anchor");
          return !!(anchor && anchor.object3D && anchor.object3D.visible === true);
        },

        _dist: function (t0, t1) {
          const dx = t0.clientX - t1.clientX;
          const dy = t0.clientY - t1.clientY;
          return Math.hypot(dx, dy);
        },

        _onTouchStart: function (e) {
          if (!this._isModelVisible()) return;

          if (e.touches.length === 1) {
            e.preventDefault();
            this._active = true;
            this._mode = "rotate";
            this._lastX = e.touches[0].clientX;
            this._lastY = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            e.preventDefault();
            this._active = true;
            this._mode = "pinch";
            this._startDist = this._dist(e.touches[0], e.touches[1]);
            this._startScale.copy(this.el.object3D.scale);
          }
        },

        _onTouchMove: function (e) {
          if (!this._active) return;
          if (!this._isModelVisible()) return;

          if (this._mode === "rotate" && e.touches.length === 1) {
            e.preventDefault();

            const x = e.touches[0].clientX;
            const y = e.touches[0].clientY;

            const dx = x - this._lastX;
            const dy = y - this._lastY;

            this._lastX = x;
            this._lastY = y;

            const yawDelta = dx * 0.01 * this.data.rotateSpeed;
            this.el.object3D.rotation.y += yawDelta;

            this._velYaw = yawDelta;
            this._velPitch = dy * 0.01 * this.data.rotateSpeed;
          }

          if (this._mode === "pinch" && e.touches.length === 2) {
            e.preventDefault();

            const d = this._dist(e.touches[0], e.touches[1]);
            if (this._startDist <= 0) return;

            const ratio = d / this._startDist;
            const s = Math.max(
              this.data.minScale,
              Math.min(this.data.maxScale, this._startScale.x * ratio)
            );

            this.el.object3D.scale.set(s, s, s);
          }
        },

        _onTouchEnd: function (e) {
          if (e.touches.length === 0) {
            this._active = false;
            this._mode = "none";
            this._startDist = 0;
          } else if (e.touches.length === 1) {
            this._mode = "rotate";
            this._lastX = e.touches[0].clientX;
            this._lastY = e.touches[0].clientY;
          }
        },

        tick: function () {
          const now = performance.now();
          const dt = Math.min(0.05, (now - this._lastTick) / 1000);
          this._lastTick = now;

          if (!this._isModelVisible()) return;

          if (!this._active) {
            const autoRadPerSec = (this.data.autoRotateSpeed * Math.PI) / 180;
            this.el.object3D.rotation.y += autoRadPerSec * dt;
          }

          if (!this._active) {
            this.el.object3D.rotation.y += this._velYaw;

            const f = Math.pow(this.data.inertia, 60 * dt);
            this._velYaw *= f;

            if (Math.abs(this._velYaw) < 0.00002) this._velYaw = 0;
          }
        }
      });

      showHint("Drag to spin. Pinch to scale.", 1600);

      anchorEl.addEventListener("targetFound", () => {
        showHint("", 0);
      });

      anchorEl.addEventListener("targetLost", () => {
        showHint("Target lost. Move closer and reduce glare.");
      });
    </script>
  </body>
</html>
