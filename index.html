<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Keychain AR</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }

      /* Camera video behind WebGL */
      video {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 0 !important;
      }

      /* WebGL canvas above video */
      canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
        z-index: 1 !important;
        display: block !important;
      }

      /* Minimal overlay */
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      #top {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 12px);
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
      }

      #status {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transition: opacity 160ms ease;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #status.show {
        opacity: 1;
      }

      #gate {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        pointer-events: none;
      }

      #gateInner {
        pointer-events: auto;
        width: min(420px, 92vw);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.35);
        padding: 16px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      #title {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        color: rgba(255, 255, 255, 0.92);
        letter-spacing: 0.2px;
      }

      #copy {
        margin: 8px 0 0 0;
        font-size: 13px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.78);
      }

      #startBtn {
        margin-top: 12px;
        width: 100%;
        padding: 12px 14px;
        border: 0;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.92);
        color: #0b0b0c;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
      }

      #startBtn:active {
        transform: translateY(1px);
      }

      #hint {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: calc(env(safe-area-inset-bottom) + 12px);
        font-size: 13px;
        line-height: 1.25;
        color: rgba(255, 255, 255, 0.88);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transition: opacity 160ms ease;
        text-align: center;
        pointer-events: none;
      }

      #hint.show {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="overlay" aria-hidden="true">
      <div id="top">
        <div id="status"></div>
        <div></div>
      </div>

      <div id="gate">
        <div id="gateInner">
          <h1 id="title">Keychain AR</h1>
          <p id="copy">
            Tap Start, allow camera access, then point at the symbol.
          </p>
          <button id="startBtn" type="button">Start</button>
        </div>
      </div>

      <div id="hint">Keep the symbol in frame.</div>
    </div>

    <a-scene
      id="scene"
      embedded
      renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      mindar-image="
        imageTargetSrc: ./targets/targets.mind;
        autoStart: false;
        uiScanning: true;
        uiLoading: true;

        filterMinCF: 0.001;
        filterBeta: 25;

        warmupTolerance: 10;
        missTolerance: 10;
      "
    >
      <a-assets>
        <a-asset-item id="model" src="./models/model.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; intensity: 0.9"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="0 2 1"></a-entity>

      <a-entity id="anchor" mindar-image-target="targetIndex: 0">
        <a-entity
          id="smooth"
          pose-stabilizer="posLerp: 0.14; rotLerp: 0.12; scaleLerp: 0.10; maxScaleStep: 0.015; holdMs: 250;"
        >
          <a-gltf-model
            src="#model"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.35 0.35 0.35"
          ></a-gltf-model>
        </a-entity>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const gate = document.getElementById("gate");
      const startBtn = document.getElementById("startBtn");
      const statusEl = document.getElementById("status");
      const hintEl = document.getElementById("hint");

      const sceneEl = document.getElementById("scene");
      const anchorEl = document.getElementById("anchor");

      function setStatus(msg, show = true) {
        statusEl.textContent = msg || "";
        if (show && msg) statusEl.classList.add("show");
        else statusEl.classList.remove("show");
      }

      function setHint(msg, show = true) {
        if (msg) hintEl.textContent = msg;
        if (show) hintEl.classList.add("show");
        else hintEl.classList.remove("show");
      }

      AFRAME.registerComponent("pose-stabilizer", {
        schema: {
          posLerp: { type: "number", default: 0.14 },
          rotLerp: { type: "number", default: 0.12 },
          scaleLerp: { type: "number", default: 0.10 },
          maxScaleStep: { type: "number", default: 0.015 },
          holdMs: { type: "number", default: 250 }
        },

        init: function () {
          this._smPos = new THREE.Vector3();
          this._smQuat = new THREE.Quaternion();
          this._smScale = new THREE.Vector3(1, 1, 1);
          this._tmpScale = new THREE.Vector3();

          this._hasInit = false;
          this._lastSeen = performance.now();
          this._visible = false;
        },

        tick: function () {
          const now = performance.now();
          const parent = this.el.parentEl && this.el.parentEl.object3D;
          if (!parent) return;

          const tracked = parent.visible === true;

          if (tracked) {
            this._lastSeen = now;

            const pos = parent.position;
            const quat = parent.quaternion;
            const scale = parent.scale;

            if (!this._hasInit) {
              this._smPos.copy(pos);
              this._smQuat.copy(quat);
              this._smScale.copy(scale);
              this._hasInit = true;
            } else {
              this._smPos.lerp(pos, this.data.posLerp);
              this._smQuat.slerp(quat, this.data.rotLerp);

              const dx = scale.x - this._smScale.x;
              const dy = scale.y - this._smScale.y;
              const dz = scale.z - this._smScale.z;

              const maxStep = this.data.maxScaleStep;
              this._tmpScale.set(
                this._smScale.x + Math.max(-maxStep, Math.min(maxStep, dx)),
                this._smScale.y + Math.max(-maxStep, Math.min(maxStep, dy)),
                this._smScale.z + Math.max(-maxStep, Math.min(maxStep, dz))
              );

              this._smScale.lerp(this._tmpScale, this.data.scaleLerp);
            }

            this.el.object3D.position.copy(this._smPos);
            this.el.object3D.quaternion.copy(this._smQuat);
            this.el.object3D.scale.copy(this._smScale);

            this._visible = true;
            this.el.object3D.visible = true;
          } else {
            if (this._visible && (now - this._lastSeen) < this.data.holdMs) {
              this.el.object3D.visible = true;
            } else {
              this.el.object3D.visible = false;
              this._visible = false;
            }
          }
        }
      });

      async function startAR() {
        try {
          setStatus("Starting camera…", true);

          if (!sceneEl.hasLoaded) {
            await new Promise((resolve) =>
              sceneEl.addEventListener("loaded", resolve, { once: true })
            );
          }

          const mindarSystem = sceneEl.systems["mindar-image-system"];
          await mindarSystem.start();

          gate.style.display = "none";
          setStatus("", false);
          setHint("Keep the symbol in frame.", true);

          setTimeout(() => setHint("", false), 1400);
        } catch (e) {
          console.error(e);
          setStatus("Camera start failed. Refresh and try again.", true);
        }
      }

      startBtn.addEventListener("click", startAR);

      anchorEl.addEventListener("targetFound", () => {
        setStatus("Locked", true);
        setTimeout(() => setStatus("", false), 600);
      });

      anchorEl.addEventListener("targetLost", () => {
        setHint("Target lost. Move closer and reduce glare.", true);
      });

      setStatus("Ready", true);
    </script>
  </body>
</html>
