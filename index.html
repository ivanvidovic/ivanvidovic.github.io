<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Keychain AR</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      video {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 0 !important;
      }

      canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
        z-index: 1 !important;
      }

      #ui {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 3;
        pointer-events: none;
      }

      #panel {
        pointer-events: auto;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(0,0,0,.6);
        color: white;
        font: 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial;
        text-align: center;
        max-width: min(360px, 92vw);
      }

      #startBtn {
        margin-top: 10px;
        width: 100%;
        padding: 12px 14px;
        border: 0;
        border-radius: 12px;
        background: rgba(255,255,255,.92);
        color: #000;
        font: 600 14px system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }

      #status {
        margin-top: 10px;
        opacity: 0.9;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div id="ui">
      <div id="panel">
        <div><b>Keychain AR</b></div>
        <div style="margin-top:6px">Tap Start, allow camera, then point at the symbol.</div>
        <button id="startBtn" type="button">Start</button>
        <div id="status"></div>
      </div>
    </div>

    <a-scene
      id="scene"
      embedded
      renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"

      mindar-image="
        imageTargetSrc: ./targets/targets.mind;
        autoStart: false;
        uiScanning: true;
        uiLoading: true;

        filterMinCF: 0.0005;
        filterBeta: 40;

        warmupTolerance: 7;
        missTolerance: 7;
      "
    >
      <a-assets>
        <a-asset-item id="model" src="./models/model.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; intensity: 0.85"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="0 2 1"></a-entity>

      <!-- Anchor driven by MindAR pose -->
      <a-entity id="anchor" mindar-image-target="targetIndex: 0">
        <!-- Wrapper lets us smooth without fighting MindAR -->
        <a-entity
          id="smooth"
          pose-stabilizer="posLerp: 0.22; rotLerp: 0.18; scaleLerp: 0.14; maxScaleStep: 0.03; holdMs: 200;"
        >
          <a-gltf-model
            src="#model"
            position="0 0 0"
            rotation="0 0 0"
            scale="0.35 0.35 0.35"
          ></a-gltf-model>
        </a-entity>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const ui = document.getElementById("ui");
      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("startBtn");
      const sceneEl = document.getElementById("scene");
      const anchorEl = document.getElementById("anchor");

      function setStatus(msg) { statusEl.textContent = msg || ""; }

      // Smooth the pose coming from the MindAR target
      AFRAME.registerComponent("pose-stabilizer", {
        schema: {
          posLerp: { type: "number", default: 0.2 },     // 0..1  (higher = snappier, lower = smoother)
          rotLerp: { type: "number", default: 0.18 },    // 0..1
          scaleLerp: { type: "number", default: 0.12 },  // 0..1
          maxScaleStep: { type: "number", default: 0.03 }, // clamp per frame scale delta
          holdMs: { type: "number", default: 200 }       // hold last pose after loss
        },

        init: function () {
          this._tmpPos = new THREE.Vector3();
          this._tmpQuat = new THREE.Quaternion();
          this._tmpScale = new THREE.Vector3();

          this._smPos = new THREE.Vector3();
          this._smQuat = new THREE.Quaternion();
          this._smScale = new THREE.Vector3(1, 1, 1);

          this._hasInit = false;
          this._lastSeen = performance.now();
          this._visible = false;

          // The entity with this component lives under the MindAR anchor.
          // We read the anchor pose from the parent each frame.
          this._anchorObj = this.el.parentEl && this.el.parentEl.object3D ? this.el.parentEl.object3D : null;
        },

        tick: function () {
          if (!this._anchorObj) return;

          const now = performance.now();

          // MindAR sets anchorEl.object3D.visible based on tracking.
          const tracked = this.el.parentEl.object3D.visible === true;

          if (tracked) {
            this._lastSeen = now;

            // Read current anchor pose
            this._anchorObj.getWorldPosition(this._tmpPos);
            this._anchorObj.getWorldQuaternion(this._tmpQuat);
            this._anchorObj.getWorldScale(this._tmpScale);

            // Convert world pose into local pose relative to the anchor parent
            // Since we're a child of the anchor, we want the anchor's local transform.
            // Easier: just use parent's local transform directly.
            const parent = this.el.parentEl.object3D;

            const pos = parent.position;
            const quat = parent.quaternion;
            const scale = parent.scale;

            if (!this._hasInit) {
              this._smPos.copy(pos);
              this._smQuat.copy(quat);
              this._smScale.copy(scale);
              this._hasInit = true;
            } else {
              this._smPos.lerp(pos, this.data.posLerp);
              this._smQuat.slerp(quat, this.data.rotLerp);

              // Scale smoothing with clamp to prevent breathing
              const targetScale = scale;
              const clamped = this._tmpScale.copy(this._smScale);
              const dx = targetScale.x - this._smScale.x;
              const dy = targetScale.y - this._smScale.y;
              const dz = targetScale.z - this._smScale.z;

              const maxStep = this.data.maxScaleStep;
              clamped.x += Math.max(-maxStep, Math.min(maxStep, dx));
              clamped.y += Math.max(-maxStep, Math.min(maxStep, dy));
              clamped.z += Math.max(-maxStep, Math.min(maxStep, dz));

              this._smScale.lerp(clamped, this.data.scaleLerp);
            }

            // Apply smoothed transform to this wrapper
            this.el.object3D.position.copy(this._smPos);
            this.el.object3D.quaternion.copy(this._smQuat);
            this.el.object3D.scale.copy(this._smScale);

            this._visible = true;
            this.el.object3D.visible = true;
          } else {
            // If tracking was just lost, hold for a short time to reduce popping.
            if (this._visible && (now - this._lastSeen) < this.data.holdMs) {
              this.el.object3D.visible = true;
            } else {
              this.el.object3D.visible = false;
              this._visible = false;
            }
          }
        }
      });

      startBtn.addEventListener("click", async () => {
        try {
          setStatus("Starting camera…");

          if (!sceneEl.hasLoaded) {
            await new Promise((resolve) => sceneEl.addEventListener("loaded", resolve, { once: true }));
          }

          const mindarSystem = sceneEl.systems["mindar-image-system"];
          await mindarSystem.start();

          ui.style.display = "none";
          setStatus("");
        } catch (e) {
          console.error(e);
          setStatus("Camera start failed. Refresh and try again.");
        }
      });

      // Optional: quick debug logs
      anchorEl.addEventListener("targetFound", () => {});
      anchorEl.addEventListener("targetLost", () => {});
    </script>
  </body>
</html>
