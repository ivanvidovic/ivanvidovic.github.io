<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Keychain AR</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Loader only (uses A-Frame's global THREE) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/RGBELoader.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      }
      video {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 0 !important;
      }
      canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
        z-index: 1 !important;
        display: block !important;
      }
      #hint {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(env(safe-area-inset-bottom) + 12px);
        text-align: center;
        font-size: 13px;
        line-height: 1.25;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transition: opacity 160ms ease;
        z-index: 5;
        pointer-events: none;
      }
      #hint.show { opacity: 1; }
    </style>

    <script>
      // ---------- Components must be registered BEFORE <a-scene> ----------

      AFRAME.registerComponent("pose-stabilizer", {
        schema: {
          posLerp: { type: "number", default: 0.14 },
          rotLerp: { type: "number", default: 0.12 },
          scaleLerp: { type: "number", default: 0.10 },
          maxScaleStep: { type: "number", default: 0.015 },
          holdMs: { type: "number", default: 250 }
        },

        init: function () {
          this._smPos = new THREE.Vector3();
          this._smQuat = new THREE.Quaternion();
          this._smScale = new THREE.Vector3(1, 1, 1);
          this._tmpScale = new THREE.Vector3();
          this._hasInit = false;
          this._lastSeen = performance.now();
          this._visible = false;
        },

        tick: function () {
          const now = performance.now();
          const parent = this.el.parentEl && this.el.parentEl.object3D;
          if (!parent) return;

          const tracked = parent.visible === true;

          if (tracked) {
            this._lastSeen = now;

            const pos = parent.position;
            const quat = parent.quaternion;
            const scale = parent.scale;

            if (!this._hasInit) {
              this._smPos.copy(pos);
              this._smQuat.copy(quat);
              this._smScale.copy(scale);
              this._hasInit = true;
            } else {
              this._smPos.lerp(pos, this.data.posLerp);
              this._smQuat.slerp(quat, this.data.rotLerp);

              const dx = scale.x - this._smScale.x;
              const dy = scale.y - this._smScale.y;
              const dz = scale.z - this._smScale.z;

              const maxStep = this.data.maxScaleStep;
              this._tmpScale.set(
                this._smScale.x + Math.max(-maxStep, Math.min(maxStep, dx)),
                this._smScale.y + Math.max(-maxStep, Math.min(maxStep, dy)),
                this._smScale.z + Math.max(-maxStep, Math.min(maxStep, dz))
              );

              this._smScale.lerp(this._tmpScale, this.data.scaleLerp);
            }

            this.el.object3D.position.copy(this._smPos);
            this.el.object3D.quaternion.copy(this._smQuat);
            this.el.object3D.scale.copy(this._smScale);

            this._visible = true;
            this.el.object3D.visible = true;
          } else {
            if (this._visible && (now - this._lastSeen) < this.data.holdMs) {
              this.el.object3D.visible = true;
            } else {
              this.el.object3D.visible = false;
              this._visible = false;
            }
          }
        }
      });

      AFRAME.registerComponent("touch-manipulator", {
        schema: {
          spinAxis: { type: "string", default: "z" },            // "x" | "y" | "z"
          rotateSpeed: { type: "number", default: 0.22 },
          inertia: { type: "number", default: 0.982 },          // longer glide
          inertiaBoost: { type: "number", default: 1.55 },      // heavier flick
          autoRotateSpeed: { type: "number", default: 0.55 },   // degrees/sec (base spin)
          minScale: { type: "number", default: 0.05 },
          maxScale: { type: "number", default: 14.0 }
        },

        init: function () {
          this._active = false;
          this._mode = "none";
          this._lastX = 0;

          this._startDist = 0;
          this._startScale = new THREE.Vector3();

          this._velSpin = 0;
          this._lastTick = performance.now();

          this._onTouchStart = this._onTouchStart.bind(this);
          this._onTouchMove = this._onTouchMove.bind(this);
          this._onTouchEnd = this._onTouchEnd.bind(this);

          document.addEventListener("touchstart", this._onTouchStart, { passive: false });
          document.addEventListener("touchmove", this._onTouchMove, { passive: false });
          document.addEventListener("touchend", this._onTouchEnd, { passive: false });
          document.addEventListener("touchcancel", this._onTouchEnd, { passive: false });
        },

        remove: function () {
          document.removeEventListener("touchstart", this._onTouchStart);
          document.removeEventListener("touchmove", this._onTouchMove);
          document.removeEventListener("touchend", this._onTouchEnd);
          document.removeEventListener("touchcancel", this._onTouchEnd);
        },

        _isTracked: function () {
          const anchor = document.getElementById("anchor");
          return !!(anchor && anchor.object3D && anchor.object3D.visible === true);
        },

        _dist: function (t0, t1) {
          const dx = t0.clientX - t1.clientX;
          const dy = t0.clientY - t1.clientY;
          return Math.hypot(dx, dy);
        },

        _applySpinDelta: function (delta) {
          const r = this.el.object3D.rotation;
          const a = this.data.spinAxis;
          if (a === "x") r.x += delta;
          else if (a === "y") r.y += delta;
          else r.z += delta;
        },

        _onTouchStart: function (e) {
          if (!this._isTracked()) return;

          if (e.touches.length === 1) {
            e.preventDefault();
            this._active = true;
            this._mode = "rotate";
            this._lastX = e.touches[0].clientX;
          } else if (e.touches.length === 2) {
            e.preventDefault();
            this._active = true;
            this._mode = "pinch";
            this._startDist = this._dist(e.touches[0], e.touches[1]);
            this._startScale.copy(this.el.object3D.scale);
          }
        },

        _onTouchMove: function (e) {
          if (!this._active) return;
          if (!this._isTracked()) return;

          if (this._mode === "rotate" && e.touches.length === 1) {
            e.preventDefault();

            const x = e.touches[0].clientX;
            const dx = x - this._lastX;
            this._lastX = x;

            const spinDelta = dx * 0.01 * this.data.rotateSpeed;
            this._applySpinDelta(spinDelta);

            // Heavier: store amplified velocity for inertia
            this._velSpin = spinDelta * this.data.inertiaBoost;
          }

          if (this._mode === "pinch" && e.touches.length === 2) {
            e.preventDefault();

            const d = this._dist(e.touches[0], e.touches[1]);
            if (this._startDist <= 0) return;

            const ratio = d / this._startDist;
            const s = Math.max(
              this.data.minScale,
              Math.min(this.data.maxScale, this._startScale.x * ratio)
            );

            this.el.object3D.scale.set(s, s, s);
          }
        },

        _onTouchEnd: function (e) {
          if (e.touches.length === 0) {
            this._active = false;
            this._mode = "none";
            this._startDist = 0;
          } else if (e.touches.length === 1) {
            this._mode = "rotate";
            this._lastX = e.touches[0].clientX;
          }
        },

        tick: function () {
          const now = performance.now();
          const dt = Math.min(0.05, (now - this._lastTick) / 1000);
          this._lastTick = now;

          if (!this._isTracked()) return;

          // Base auto spin ALWAYS while tracked (your definition of auto-rotate)
          const autoRadPerSec = (this.data.autoRotateSpeed * Math.PI) / 180;
          this._applySpinDelta(autoRadPerSec * dt);

          // Extra inertia spin when not touching
          if (!this._active && this._velSpin !== 0) {
            this._applySpinDelta(this._velSpin);

            const f = Math.pow(this.data.inertia, 60 * dt);
            this._velSpin *= f;

            if (Math.abs(this._velSpin) < 0.00002) this._velSpin = 0;
          }
        }
      });

      // ---------- HDR / IBL helpers ----------
      function applyEnvMapToModel(modelEl, envMap, opts = {}) {
        const {
          envIntensity = 2.0,
          chromeBoost = true,         // force chrome-y response
          minMetalness = 0.9,
          maxRoughness = 0.18
        } = opts;

        const obj = modelEl.getObject3D("mesh");
        if (!obj) return;

        obj.traverse((n) => {
          if (!n.isMesh || !n.material) return;
          const mats = Array.isArray(n.material) ? n.material : [n.material];

          mats.forEach((m) => {
            const isPBR = !!(m && (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial));
            if (!isPBR) return;

            // Force envMap onto the material (more reliable than scene.environment alone in some setups)
            m.envMap = envMap;
            m.envMapIntensity = envIntensity;

            if (chromeBoost) {
              if (typeof m.metalness === "number") m.metalness = Math.max(m.metalness, minMetalness);
              if (typeof m.roughness === "number") m.roughness = Math.min(m.roughness, maxRoughness);
            }

            m.needsUpdate = true;
          });
        });
      }

      async function setupHDRIBL(sceneEl, modelEl, hdrUrl) {
        await new Promise((resolve) => sceneEl.addEventListener("loaded", resolve, { once: true }));

        const renderer = sceneEl.renderer;
        if (!renderer) return;

        // Make sure we’re in modern color space
        if (renderer.outputColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;

        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();

        const loader = new THREE.RGBELoader();
        loader.setDataType(THREE.HalfFloatType);

        loader.load(
          hdrUrl,
          (hdrTex) => {
            const envMap = pmrem.fromEquirectangular(hdrTex).texture;

            // IBL without changing background
            sceneEl.object3D.environment = envMap;

            hdrTex.dispose();
            pmrem.dispose();

            // Apply to model materials when ready
            if (modelEl.getObject3D("mesh")) {
              applyEnvMapToModel(modelEl, envMap, { envIntensity: 2.4, chromeBoost: true });
            } else {
              modelEl.addEventListener(
                "model-loaded",
                () => applyEnvMapToModel(modelEl, envMap, { envIntensity: 2.4, chromeBoost: true }),
                { once: true }
              );
            }
          },
          undefined,
          (err) => console.error("HDR load failed:", err)
        );
      }
    </script>
  </head>

  <body>
    <div id="hint"></div>

    <a-scene
      id="scene"
      embedded
      renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic; toneMappingExposure: 1.1;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      mindar-image="
        imageTargetSrc: ./targets/targets.mind;
        autoStart: true;
        uiScanning: true;
        uiLoading: true;

        filterMinCF: 0.001;
        filterBeta: 25;

        warmupTolerance: 10;
        missTolerance: 10;
      "
    >
      <a-assets>
        <a-asset-item id="model" src="./models/model.glb"></a-asset-item>
      </a-assets>

      <!-- Keep these subtle now that IBL is doing the real work -->
      <a-entity light="type: ambient; intensity: 0.25"></a-entity>
      <a-entity light="type: directional; intensity: 0.55" position="1.2 2.4 1.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.25" position="-2 1.8 -1.2"></a-entity>

      <a-entity id="anchor" mindar-image-target="targetIndex: 0">
        <a-entity
          id="smooth"
          pose-stabilizer="posLerp: 0.14; rotLerp: 0.12; scaleLerp: 0.10; maxScaleStep: 0.015; holdMs: 250;"
        >
          <a-entity
            id="spinRoot"
            touch-manipulator="
              spinAxis: z;
              rotateSpeed: 0.22;
              inertia: 0.982;
              inertiaBoost: 1.55;
              autoRotateSpeed: 0.55;
              minScale: 0.05;
              maxScale: 14.0;
            "
          >
            <!-- Your corrected orientation -->
            <a-entity id="modelOrient" rotation="90 0 0">
              <a-gltf-model id="arModel" src="#model" scale="1.05 1.05 1.05"></a-gltf-model>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const hintEl = document.getElementById("hint");
      const anchorEl = document.getElementById("anchor");
      const sceneEl = document.getElementById("scene");
      const modelEl = document.getElementById("arModel");

      let hintTimer = null;
      function showHint(msg, autoHideMs = 0) {
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = null;

        hintEl.textContent = msg || "";
        hintEl.classList.toggle("show", !!msg);

        if (msg && autoHideMs > 0) {
          hintTimer = setTimeout(() => {
            hintEl.classList.remove("show");
            hintEl.textContent = "";
            hintTimer = null;
          }, autoHideMs);
        }
      }

      showHint("Drag to spin. Pinch to scale.", 1200);

      anchorEl.addEventListener("targetFound", () => showHint("", 0));
      anchorEl.addEventListener("targetLost", () => showHint("Target lost. Move closer and reduce glare."));

      // HDR file location
      setupHDRIBL(sceneEl, modelEl, "./hdr/env.hdr");
    </script>
  </body>
</html>
